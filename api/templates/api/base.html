<!DOCTYPE html>
<html>
<head><title>TaskFlow</title></head>
<body>
  <h1>📋 TaskFlow</h1>
  {% if user.is_authenticated %}
    <p>Hola, {{ user.username }} | <a href="{% url 'logout' %}">Cerrar sesión</a></p>
    <p><a href="{% url 'lista_proyectos' %}">Proyectos</a> | <a href="{% url 'lista_tareas' %}">Tareas</a></p>
  {% endif %}
  <hr>
  {% for msg in messages %}<p>{{ msg }}</p>{% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
